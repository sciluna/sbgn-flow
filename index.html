<!DOCTYPE>

<html>

<head>
	<title>SBGNFlow</title>

	<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1, maximum-scale=1">
	<!-- Fomantic UI -->
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fomantic-ui@2.9.4/dist/semantic.min.css">
	<link href="app/css/style.css" rel="stylesheet">
	<link href="app/css/cytoscape-context-menus.css" rel="stylesheet" type="text/css" />
</head>

<body>
	<div class="ui wide container">
		<div class="ui vertically divided grid">
			<div class="row" style="padding-bottom: 0; margin-top: 10px;">
				<div class="four wide column" style="display: flex; align-items: center;">
					<a href="https://github.com/sciluna" target="_blank" style="color: #d67664;">
						<h2>Luna Lab</h2>
					</a>
				</div>
				<div class="eight wide column">
					<h2 class="ui padded center aligned header" style="margin-top: 5px;">
						SBGNFlow
					</h2>
				</div>
				<div class="four wide column">
					<a href="https://github.com/sciluna/sbgn-flow" target="_blank">
						<img class="ui image" src="app/img/github-mark.svg" title="Go to GitHub Repository" style="height: 30px; margin-top: 5px; float: right">
					</a>
				</div>
			</div>
			<div class="two column row" style="padding-bottom: 0; padding-top: 0;">
				<div class="four wide column" style="padding-right: 0;">
					<div class="ui styled accordion">
						<div class="active title">
							<i class="dropdown icon"></i>
							Convert Image to SBGN
						</div>
						<div class="active content">
							<h5 class="ui header" style="margin-bottom: 5px;">File</h5>
							<div class="ui small form">
								<div class="field">
									<div class="inline fields">
										<label>Open Sample:</label>
										<div class="six wide field">
											<select required id="samples">
												<option value="">Select...</option>
												<option value="sample1">SampleAF 1</option>
												<option value="sample2">SampleAF 2</option>
												<option value="sample3">SampleAF 3</option>
												<option value="sample4">SamplePD 1</option>
												<option value="sample5">SamplePD 2</option>
												<option value="sample6">SamplePD 3</option>
											</select>
										</div>
										<div class="ui tiny button" id="load-image" tabindex="0">
											Open File...
										</div>
									</div>
									<div class="ui button" id="upload-file" tabindex="0" style="display:none" >
										Load File...
									</div>
								</div>
								<input id="image-input" type="file" accept="image/*" style="display:none" />

								<div class="ui divider" style="margin-top: 7px; margin-bottom: 7px;"></div>
								<h5 class="ui header" style="margin-top: 10px; margin-bottom: 5px;">Settings</h5>
								<div class="field">
									<div class="inline fields" style="margin-top: 0px; margin-bottom: 5px;">
										<label style="margin-top: 5px;">Map Type</label>
										<div class="field">
											<div class="ui radio checkbox">
												<input type="radio" id="radioAF" name="language" checked="checked">
												<label>AF</label>
											</div>
										</div>
										<div class="field">
											<div class="ui radio checkbox">
												<input type="radio" id="radioPD" name="language">
												<label>PD</label>
											</div>
										</div>
									</div>
									<div class="inline fields" style="margin-top: 0px; margin-bottom: 5px;">
										<label style="margin-top: 5px;">Model</label>
										<div class="field">
											<div class="ui radio checkbox">
												<input type="radio" id="gemini-3.1-pro-preview" name="model"  checked="checked">
												<label>Gemini 3.1 Pro</label>
											</div>
											<div class="ui radio checkbox">
												<input type="radio" id="gpt-5.2" name="model">
												<label>GPT-5.2</label>
											</div>
										</div>
									</div>
									<div class="inline fields" style="margin-top: 0px; margin-bottom: 5px;">
										<label style="margin-top: 5px;">Apply layout after conversion</label>
										<div class="field">
											<div class="ui tiny checkbox">
												<input type="checkbox" id="polishConversion" name="mapStatus" checked>
											</div>
										</div>
									</div>
									<div class="inline fields" style="margin-top: 0px; margin-bottom: 5px;">
										<label style="margin-top: 5px;">Keep current content</label>
										<div class="field">
											<div class="ui tiny checkbox">
												<input type="checkbox" id="mapStatus" name="mapStatus">
											</div>
										</div>
									</div>
								</div>
								<div id='imageArea'>
									<div class="ui form">
										<div class="field">
											<div id="imageInput" class="ui segment" style="width: auto; height: 200px; margin-top: -3px; padding: 0px;">
												<img id="inputImage" draggable="true" style="cursor:pointer; padding: 0px !important;" class="ui centered huge image" >
											</div>
										</div>
									</div>
								</div>
								<div style="margin-top: 10px; border-top: 0px !important;">
									<button id="processData" class="tiny ui orange button">Process Data</button>
									<span id="tokenCount">Tokens used:</span>
								</div>
							</div>
							<!-- Settings -->
						</div>
						<div class="title">
							<i class="dropdown icon"></i>
							Merge/Split Maps
						</div>
						<div class="content">
							<div class="ui small form">
								<h5 class="ui header" style="margin-bottom: 10px;">Node/Edge Matching Settings</h5>
								<div class="inline fields" style="margin-top: 0px; margin-bottom: 10px;">
									<label>Node:</label>
									<label>Label</label>
									<div class="field">
										<div class="ui tiny checkbox">
											<input type="checkbox" id="checkLabel" checked>
										</div>
									</div>
									<label>Identifier</label>
									<div class="field">
										<div class="ui tiny checkbox">
											<input type="checkbox" id="checkIdentifier">
										</div>
									</div>
								</div>
								<div class="inline fields" style="margin-top: 0px; margin-bottom: 10px;">
									<label>Edge:</label>
									<label>Cardinality</label>
									<div class="field">
										<div class="ui tiny checkbox">
											<input type="checkbox" id="checkCardinality">
										</div>
									</div>
								</div>
								<div class="ui divider" style="margin-top: 7px; margin-bottom: 7px;"></div>
								<h5 class="ui header" style="margin-top: 0px; margin-bottom: 10px;">Merge</h5>
								<div class="inline fields" style="margin-top: 0px; margin-bottom: 10px;">
									<label title="Select one node from each of the two separate components and perform the merge operation through those nodes">Merge pairwise</label>
									<div class="field">
										<div class="ui tiny checkbox">
											<input type="checkbox" id="mergePairwise" name="mergePairwise">
										</div>
									</div>
									<label id="strictCheckLabel" style="opacity: 0.5;">Strict check</label>
									<div class="field">
										<div class="ui tiny checkbox">
											<input type="checkbox" id="strictCheck" name="strictCheck" disabled checked>
										</div>
									</div>
								</div>
								<div class="inline fields" style="margin-top: 0px; margin-bottom: 0px;">
									<div class="two ui mini circular buttons" style="margin-bottom: 5px;">
										<button id="addSourceComponent" class="compact ui button" title="Select and add a source component for the merge operation">Add Source Component</button>
										<button id="addTargetComponent" class="compact ui button" title="Select and add a target component for the merge operation">Add Target Component</button>
									</div>
								</div>
								<span id="componentMessage" disabled>Select and add source and target components!</span>
								<div class="inline fields" style="margin-top: 10px; margin-bottom: 10px;">
									<label style="margin-top: 0px;">Animate</label>
									<div class="field">
										<div class="ui radio checkbox">
											<input type="radio" id="radioAnimationEnd" name="animation" checked="checked">
											<label>End</label>
										</div>
									</div>
									<div class="field">
										<div class="ui radio checkbox">
											<input type="radio" id="radioAnimationDuring" name="animation">
											<label>During</label>
										</div>
									</div>
								</div>
								<div class="inline fields" style="margin-top: 10px; border-top: 0px !important;">
									<button id="mergeButton" class="tiny ui orange button" title="Either merge source component to target component or perform pairwise merge operation">Apply Merge</button>
								</div>
								<div class="ui divider" style="margin-top: 7px; margin-bottom: 7px;"></div>
								<h5 class="ui header" style="margin-top: 0px; margin-bottom: 10px;">Split</h5>
								<div class="inline fields" style="margin-top: 0px; margin-bottom: 10px;">
									<label>Keep connection nodes on split</label>
									<div class="field">
										<div class="ui tiny checkbox">
											<input type="checkbox" id="keepConnectionPoint" checked>
										</div>
									</div>
								</div>
								<div style="margin-top: 10px; border-top: 0px !important;">
									<button id="splitButton" class="tiny ui orange button" title="Split selected from unselected">Split Selected</button>
								</div>
							</div>
						</div>
						<div class="title">
							<i class="dropdown icon"></i>
							Apply Layout
						</div>
						<div class="content">
							<div class="two ui tiny circular buttons" style="margin-bottom: 5px;">
								<button id="pinSelected" class="compact ui button">Pin Selected</button>
								<button id="unpinSelected" class="compact ui button">Unpin Selected</button>
							</div>
							<div class="two ui tiny circular buttons" style="margin-bottom: 5px;">
								<button id="unpinAll" class="compact ui button">Unpin All</button>
								<button id="selectAll" class="compact ui button">Select All</button>
							</div>
							<div class="four ui tiny circular buttons">
								<button id="verticalFlip" style="margin-right: 1px;" class="compact ui button"><i class="fitted arrows alternate vertical icon" title="Flip vertically"></i></button>
 								<button id="horizontalFlip" style="margin-right: 1px;" class="compact ui button"><i class="fitted arrows alternate horizontal icon" title="Flip horizontally"></i></button>
 								<button id="rotateClockwise" style="margin-right: 1px;" class="compact ui button"><i class="fitted redo alternate icon" title="Rotate 90&deg; clockwise"></i></button>
 								<button id="rotateCounterclockwise" class="compact ui button"><i class="fitted undo alternate icon" title="Rotate 90&deg; counterclockwise"></i></button>
							</div>
							<div class="ui small form">
								<div class="inline fields" style="margin-top: 10px;">
									<div class="field">
										<label>Ideal edge length:</label>
										<input id="idealEdgeLength" type="number" name="idealEdgeLength" max="1000" min="1" value="100">
									</div>
								</div>
							</div>
							<div id="drawingArea" style="margin-top: 10px;">
								<canvas id="drawingCanvas" width=300 height=200></canvas>
							</div>
							<div class="ui tiny wrapped spaced buttons">
								<button id="applyLayout" class="ui left floated orange button" title="Apply layout based on drawing">Apply Layout</button>
								<button id="refineLayout" class="ui left floated orange button" title="Polish layout based on edge orientations">Polish Layout</button>
							</div>
							<button id="clearCanvas" class="ui icon right floated button"><i class="sync alternate
 icon"></i></button>
						</div>
					</div>
				</div>
				<div class="twelve wide column" style="padding-right: 0;">
					<div class="ui form">
						<div class="field">
							<div class="inline fields" style="margin-bottom: 10px;"">
								<h3 class="ui header" style="margin-bottom: -3px; margin-right: 7.5px; padding: 2.5px;">Graph View</h3>
								<i class="ui large upload icon" id="uploadGraph" title="Upload an SBGNML file"></i>&nbsp;
								<input id="file-input-graph" type="file" accept="xml/*" style="display:none" />
								<i class="ui large download icon" id="downloadSbgnml" title="Download as SBGNML"></i>&nbsp;
								<img class="ui image" id="openNewt" src="app/img/newt-icon.png" title="Open in Newt" style="height: 22px; width: 22px;">
								<a class="tooltip"><i class="ui large info circle icon" id="contextMenuInfo" style="color: black;"></i>
									<span class="tooltiptext">Right click to nodes, edges or viewport for quick edit!</span></a>&nbsp;
							</div>
							<div id="cy"></div>
							<div id="objectField" class="five wide column"
								style="margin-top: 11.5px; padding-left: 0px;">
								<div class="field">
									<h3 class="ui header">Object View</h3>
									<div class="ui segment" id="objectView"></div>
								</div>
							</div>
							<div id="editField" class="five wide column">
								<div class="inline fields">
									<textarea id="editInstructions" style="margin-right: 10px; opacity: 0.8;" rows="1" cols="33" placeholder="Write instructions to edit current SBGN map..."></textarea>
									<i class="ui large paper plane icon" id="submitEdit" title="Upload an SBGNML file"></i>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>

	<div class="ui large modal" id="imageModal">
		<div class="center aligned content">
			<div class="image content">
				<img class="image" id="imageContent" style="max-height: 600px; width: auto; height: auto;">
			</div>
		</div>
	</div>

	<script>
		const canvas = document.getElementById('drawingCanvas');
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = 'white'; // Set fill color to white
    ctx.fillRect(0, 0, canvas.width, canvas.height);

		// Resize the canvas to match the parent container
    function resizeCanvas() {
      const container = document.getElementById('cy');
      const rect = container.getBoundingClientRect();
      const style = window.getComputedStyle(container);
      const borderWidth = parseFloat(style.borderLeftWidth);

      // Set the canvas's internal rendering size to match the container
      canvas.width = rect.width;
      canvas.height = rect.height;

      // Optional: Adjust for high-DPI displays
      const pixelRatio = window.devicePixelRatio || 1;
      //ctx.scale(pixelRatio, pixelRatio);
    }

    //resizeCanvas();

    // Function to clear the canvas
    function clearCanvas() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);  // Clears the entire canvas
      ctx.fillStyle = 'white'; // Set fill color to white
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    // Variables to track the drawing state
    let isDrawing = false;
    let lastX = 0;
    let lastY = 0;

    // Get the correct mouse position
    function getMousePos(canvas, event) {
      const rect = canvas.getBoundingClientRect(); // Get canvas position relative to the viewport
      return {
        x: event.clientX - rect.left,
        y: event.clientY - rect.top
      };
    }

    // Function to start drawing
    canvas.addEventListener('mousedown', (e) => {
      isDrawing = true;
      const pos = getMousePos(canvas, e);
      lastX = pos.x;
      lastY = pos.y;
    });

    // Function to draw
    canvas.addEventListener('mousemove', (e) => {
      if (!isDrawing) return;

      const pos = getMousePos(canvas, e);
      ctx.beginPath();
      ctx.moveTo(lastX, lastY);
      ctx.lineTo(pos.x, pos.y);
      ctx.strokeStyle = 'black';
      ctx.lineWidth = 10;
      ctx.stroke();
      ctx.closePath();

      lastX = pos.x;
      lastY = pos.y;
    });

    // Stop drawing when the mouse button is released
    canvas.addEventListener('mouseup', () => isDrawing = false);
    canvas.addEventListener('mouseout', () => isDrawing = false);

    ctx.fillStyle = 'white'; // Set fill color to white
    ctx.fillRect(0, 0, canvas.width, canvas.height);
	</script>
	<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
	<script src="https://code.jquery.com/ui/1.14.0/jquery-ui.min.js" crossorigin="anonymous"></script>
	<script src="https://cdn.jsdelivr.net/npm/fomantic-ui@2.9.4/dist/semantic.min.js"></script>
	<script src="dist/bundle.js"></script>

</body>

</html>
